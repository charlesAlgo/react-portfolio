<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Illustration: a release pipeline with passing checks -->
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#134e4a"/></linearGradient></defs>
  <rect width="640" height="360" fill="url(#g)"/>
  <path d="M110 160H530" stroke="#334155" stroke-width="6"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">
    <circle cx="110" cy="160" r="30" fill="#16a34a"/><path d="M97 160l9 9 17-18" stroke="#fff" stroke-width="5" fill="none"/><text x="110" y="220">Build</text>
    <circle cx="250" cy="160" r="30" fill="#16a34a"/><path d="M237 160l9 9 17-18" stroke="#fff" stroke-width="5" fill="none"/><text x="250" y="220">Tests</text>
    <circle cx="390" cy="160" r="30" fill="#16a34a"/><path d="M377 160l9 9 17-18" stroke="#fff" stroke-width="5" fill="none"/><text x="390" y="220">Acceptance</text>
    <circle cx="530" cy="160" r="30" fill="#f59e0b"/><text x="530" y="166" font-size="16" font-weight="700" fill="#0f172a">1.0</text><text x="530" y="220">Release</text>
